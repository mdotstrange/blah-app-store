<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLAH</title>
<style>
  :root {
    --green: #33ff33;
    --dim: #1a8f1a;
    --bg: #050805;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--green);
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    text-shadow: 0 0 4px rgba(51, 255, 51, 0.5);
  }
  /* subtle scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 2px,
      rgba(0, 0, 0, 0.25) 2px 4px
    );
    z-index: 10;
  }
  header {
    display: flex;
    align-items: center;
    gap: 1em;
    padding: 0.5em 1em;
    border-bottom: 1px solid var(--dim);
    flex: none;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.2em;
    letter-spacing: 0.4em;
    font-weight: bold;
  }
  header h1::after {
    content: "▊";
    animation: blink 1s steps(1) infinite;
    letter-spacing: 0;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #status { color: var(--dim); font-size: 0.85em; }
  #status.ok { color: var(--green); }
  #me { margin-left: auto; font-size: 0.9em; }
  #me button {
    background: none;
    border: 1px solid var(--dim);
    color: var(--dim);
    font: inherit;
    font-size: 0.85em;
    padding: 0 0.5em;
    cursor: pointer;
  }
  #me button:hover { color: var(--green); border-color: var(--green); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1em;
    line-height: 1.5;
    word-break: break-word;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--dim); }
  .msg .time { color: var(--dim); }
  .msg .name { font-weight: bold; }
  .msg.mine .name { color: #aaffaa; }
  .sys { color: var(--dim); font-style: italic; }
  form {
    flex: none;
    display: flex;
    gap: 0.5em;
    padding: 0.6em 1em;
    border-top: 1px solid var(--dim);
  }
  form .prompt { flex: none; }
  #input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--green);
    font: inherit;
    text-shadow: inherit;
    caret-color: var(--green);
  }
  /* name overlay */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 5, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #overlay.hidden { display: none; }
  #overlay .box {
    border: 1px solid var(--green);
    padding: 2em;
    text-align: center;
    max-width: 90vw;
  }
  #overlay h2 { letter-spacing: 0.5em; margin-bottom: 1em; }
  #overlay p { color: var(--dim); margin-bottom: 1em; font-size: 0.9em; }
  #nameInput {
    background: none;
    border: none;
    border-bottom: 1px solid var(--dim);
    outline: none;
    color: var(--green);
    font: inherit;
    text-align: center;
    width: 16em;
    max-width: 70vw;
    margin-bottom: 1.2em;
  }
  #overlay button {
    background: var(--green);
    color: var(--bg);
    border: none;
    font: inherit;
    font-weight: bold;
    padding: 0.4em 1.5em;
    cursor: pointer;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
  <header>
    <h1>BLAH</h1>
    <span id="status">connecting…</span>
    <span id="online"></span>
    <span id="me">&lt;<span id="myname"></span>&gt; <button id="rename" type="button">rename</button></span>
  </header>

  <div id="log"></div>

  <form id="form">
    <span class="prompt">&gt;</span>
    <input id="input" autocomplete="off" maxlength="500" placeholder="say something…" autofocus>
  </form>

  <div id="overlay" class="hidden">
    <div class="box">
      <h2>BLAH</h2>
      <p>pick a name (your device name works fine)</p>
      <input id="nameInput" maxlength="24" autocomplete="off">
      <br>
      <button id="join" type="button">ENTER</button>
    </div>
  </div>

<script>
(function () {
  var log = document.getElementById('log');
  var input = document.getElementById('input');
  var form = document.getElementById('form');
  var statusEl = document.getElementById('status');
  var onlineEl = document.getElementById('online');
  var overlay = document.getElementById('overlay');
  var nameInput = document.getElementById('nameInput');
  var mynameEl = document.getElementById('myname');

  var name = localStorage.getItem('blah-name') || '';
  var lastId = 0;
  var nearBottom = true;

  function setStatus(text, ok) {
    statusEl.textContent = text;
    statusEl.className = ok ? 'ok' : '';
  }

  function showOverlay(prefill) {
    nameInput.value = prefill || '';
    overlay.classList.remove('hidden');
    nameInput.focus();
    nameInput.select();
  }

  function join() {
    var n = nameInput.value.trim().slice(0, 24);
    if (!n) return;
    name = n;
    localStorage.setItem('blah-name', name);
    mynameEl.textContent = name;
    overlay.classList.add('hidden');
    input.focus();
  }

  document.getElementById('join').addEventListener('click', join);
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') join();
  });
  document.getElementById('rename').addEventListener('click', function () {
    showOverlay(name);
  });

  if (!name) showOverlay('user-' + Math.floor(1000 + Math.random() * 9000));
  else mynameEl.textContent = name;

  log.addEventListener('scroll', function () {
    nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  });

  function fmtTime(ts) {
    var d = new Date(ts);
    function pad(x) { return (x < 10 ? '0' : '') + x; }
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function addMsg(m) {
    if (m.id <= lastId) return;
    lastId = m.id;
    var div = document.createElement('div');
    div.className = 'msg' + (m.name === name ? ' mine' : '');

    var time = document.createElement('span');
    time.className = 'time';
    time.textContent = '[' + fmtTime(m.time) + '] ';

    var who = document.createElement('span');
    who.className = 'name';
    who.textContent = '<' + m.name + '>';

    var text = document.createElement('span');
    text.textContent = ' ' + m.text;

    div.appendChild(time);
    div.appendChild(who);
    div.appendChild(text);
    log.appendChild(div);

    while (log.children.length > 250) log.removeChild(log.firstChild);
    if (nearBottom) log.scrollTop = log.scrollHeight;
  }

  function addSys(text) {
    var div = document.createElement('div');
    div.className = 'sys';
    div.textContent = '*** ' + text + ' ***';
    log.appendChild(div);
  }

  function setOnline(count) {
    onlineEl.textContent = count + ' online';
  }

  function startPolling() {
    setStatus('online', true);
    addSys('live updates limited, refreshing every 2s');
    setInterval(function () {
      fetch('/messages?since=' + lastId + '&u=' + encodeURIComponent(name))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          data.messages.forEach(addMsg);
          if (nearBottom) log.scrollTop = log.scrollHeight;
          setOnline(data.online);
          setStatus('online', true);
        })
        .catch(function () { setStatus('reconnecting…', false); });
    }, 2000);
  }

  var esOpened = false;
  var es = new EventSource('/events');

  es.onopen = function () {
    esOpened = true;
    setStatus('online', true);
  };
  es.onerror = function () {
    setStatus('reconnecting…', false);
  };
  es.onmessage = function (e) {
    var data = JSON.parse(e.data);
    if (data.type === 'history') {
      data.messages.forEach(addMsg);
      log.scrollTop = log.scrollHeight;
    } else if (data.type === 'message') {
      addMsg(data.message);
    } else if (data.type === 'online') {
      setOnline(data.count);
    }
  };

  // If the event stream can't get through, fall back to polling
  setTimeout(function () {
    if (!esOpened) {
      es.close();
      startPolling();
    }
  }, 4000);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || !name) return;
    input.value = '';
    fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, text: text })
    }).catch(function () {
      addSys('message failed to send');
    });
    input.focus();
  });
})();
</script>
</body>
</html>
