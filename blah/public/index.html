<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLAH</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    --green: #33ff33;
    --dim: #1a8f1a;
    --bg: #050805;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--green);
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    text-shadow: 0 0 4px rgba(51, 255, 51, 0.5);
  }
  /* subtle scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 2px,
      rgba(0, 0, 0, 0.25) 2px 4px
    );
    z-index: 10;
  }
  header {
    display: flex;
    align-items: center;
    gap: 1em;
    padding: 0.5em 1em;
    border-bottom: 1px solid var(--dim);
    flex: none;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.2em;
    letter-spacing: 0.4em;
    font-weight: bold;
  }
  header h1::after {
    content: "▊";
    animation: blink 1s steps(1) infinite;
    letter-spacing: 0;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #status { color: var(--dim); font-size: 0.85em; }
  #status.ok { color: var(--green); }
  #me { margin-left: auto; font-size: 0.9em; }
  #me button {
    background: none;
    border: 1px solid var(--dim);
    color: var(--dim);
    font: inherit;
    font-size: 0.85em;
    padding: 0 0.5em;
    cursor: pointer;
  }
  #me button:hover { color: var(--green); border-color: var(--green); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1em;
    line-height: 1.5;
    word-break: break-word;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--dim); }
  .msg .time { color: var(--dim); }
  .msg .name { font-weight: bold; }
  .msg.mine .name { color: #aaffaa; }
  .sys { color: var(--dim); font-style: italic; }
  form {
    flex: none;
    display: flex;
    gap: 0.5em;
    padding: 0.6em 1em;
    border-top: 1px solid var(--dim);
  }
  form .prompt { flex: none; }
  #input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--green);
    font: inherit;
    text-shadow: inherit;
    caret-color: var(--green);
  }
  /* name overlay */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 5, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #overlay.hidden { display: none; }
  #overlay .box {
    border: 1px solid var(--green);
    padding: 2em;
    text-align: center;
    max-width: 90vw;
  }
  #overlay h2 { letter-spacing: 0.5em; margin-bottom: 1em; }
  #overlay p { color: var(--dim); margin-bottom: 1em; font-size: 0.9em; }
  #nameInput {
    background: none;
    border: none;
    border-bottom: 1px solid var(--dim);
    outline: none;
    color: var(--green);
    font: inherit;
    text-align: center;
    width: 16em;
    max-width: 70vw;
    margin-bottom: 1.2em;
  }
  #overlay button {
    background: var(--green);
    color: var(--bg);
    border: none;
    font: inherit;
    font-weight: bold;
    padding: 0.4em 1.5em;
    cursor: pointer;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
  <header>
    <h1>BLAH</h1>
    <span id="status">connecting…</span>
    <span id="online"></span>
    <span id="me">&lt;<span id="myname"></span>&gt; <button id="notify" type="button">notify off</button> <button id="rename" type="button">rename</button> <button id="clear" type="button" title="wipe the history for everyone">clear</button></span>
  </header>

  <div id="log"></div>

  <form id="form">
    <span class="prompt">&gt;</span>
    <input id="input" autocomplete="off" maxlength="500" placeholder="say something…" autofocus>
  </form>

  <div id="overlay" class="hidden">
    <div class="box">
      <h2>BLAH</h2>
      <p>pick a name (your device name works fine)</p>
      <input id="nameInput" maxlength="24" autocomplete="off">
      <br>
      <button id="join" type="button">ENTER</button>
    </div>
  </div>

<script>
(function () {
  var log = document.getElementById('log');
  var input = document.getElementById('input');
  var form = document.getElementById('form');
  var statusEl = document.getElementById('status');
  var onlineEl = document.getElementById('online');
  var overlay = document.getElementById('overlay');
  var nameInput = document.getElementById('nameInput');
  var mynameEl = document.getElementById('myname');
  var notifyBtn = document.getElementById('notify');

  var name = localStorage.getItem('blah-name') || '';
  // Random per-window id so two windows using the same name still count as
  // two "online" (and one person's tab can't be mistaken for another's)
  var windowId = Math.random().toString(36).slice(2) + Date.now().toString(36);
  var lastId = 0;
  var nearBottom = true;

  function setStatus(text, ok) {
    statusEl.textContent = text;
    statusEl.className = ok ? 'ok' : '';
  }

  function showOverlay(prefill) {
    nameInput.value = prefill || '';
    overlay.classList.remove('hidden');
    nameInput.focus();
    nameInput.select();
  }

  function join() {
    var n = nameInput.value.trim().slice(0, 24);
    if (!n) return;
    name = n;
    localStorage.setItem('blah-name', name);
    mynameEl.textContent = name;
    overlay.classList.add('hidden');
    input.focus();
  }

  document.getElementById('join').addEventListener('click', join);
  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') join();
  });
  document.getElementById('rename').addEventListener('click', function () {
    showOverlay(name);
  });

  var generation = null;

  function clearChat() {
    if (!name) return;
    if (!confirm('Clear the chat history for everyone?')) return;
    fetch('/clear', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    }).then(function (r) {
      if (r.status === 429) addSys('history was cleared a moment ago, try again');
      else if (!r.ok) addSys('failed to clear history');
    }).catch(function () {
      addSys('failed to clear history');
    });
  }

  document.getElementById('clear').addEventListener('click', clearChat);

  if (!name) showOverlay('user-' + Math.floor(1000 + Math.random() * 9000));
  else mynameEl.textContent = name;

  log.addEventListener('scroll', function () {
    nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  });

  function fmtTime(ts) {
    var d = new Date(ts);
    function pad(x) { return (x < 10 ? '0' : '') + x; }
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function addMsg(m, notify) {
    if (m.id <= lastId) return;
    lastId = m.id;
    var div = document.createElement('div');
    div.className = 'msg' + (m.name === name ? ' mine' : '');

    var time = document.createElement('span');
    time.className = 'time';
    time.textContent = '[' + fmtTime(m.time) + '] ';

    var who = document.createElement('span');
    who.className = 'name';
    who.textContent = '<' + m.name + '>';

    var text = document.createElement('span');
    text.textContent = ' ' + m.text;

    div.appendChild(time);
    div.appendChild(who);
    div.appendChild(text);
    log.appendChild(div);

    while (log.children.length > 250) log.removeChild(log.firstChild);
    if (nearBottom) log.scrollTop = log.scrollHeight;
    if (notify !== false) announce(m);
  }

  function addSys(text) {
    var div = document.createElement('div');
    div.className = 'sys';
    div.textContent = '*** ' + text + ' ***';
    log.appendChild(div);
  }

  // ---- notifications and unread counter ---------------------------------
  // Browsers only expose the Notification API on secure origins, so this
  // switches itself off (politely) when BLAH is opened over plain http.
  var notifyWanted = localStorage.getItem('blah-notify') === 'on';
  var openNotifications = [];
  var unread = 0;

  function notificationsSupported() {
    return window.isSecureContext !== false && typeof window.Notification !== 'undefined';
  }

  function notificationsOn() {
    return notifyWanted && notificationsSupported() && Notification.permission === 'granted';
  }

  function httpsHint() {
    return 'https://' + (location.hostname || 'umbrel.local') + (location.port ? ':' + location.port : '');
  }

  function renderNotifyButton() {
    if (!notificationsSupported()) {
      notifyBtn.textContent = 'notify n/a';
      notifyBtn.title = 'this browser needs https (or localhost) before it can show notifications';
      return;
    }
    if (Notification.permission === 'denied') {
      notifyBtn.textContent = 'notify blocked';
      notifyBtn.title = 'notifications are blocked for this site - allow them in your browser settings';
      return;
    }
    notifyBtn.textContent = notificationsOn() ? 'notify on' : 'notify off';
    notifyBtn.title = notificationsOn()
      ? 'notifications on - click to turn them off'
      : 'get an OS notification for new messages while this window is in the background';
  }

  function closeNotifications() {
    while (openNotifications.length) {
      var n = openNotifications.pop();
      try { n.close(); } catch (err) {}
    }
  }

  function clearUnread() {
    if (!unread) return;
    unread = 0;
    document.title = 'BLAH';
  }

  function showNotification(m) {
    var n;
    try {
      // One notification per message (unique tag), so nothing gets coalesced away
      n = new Notification('<' + m.name + '>', {
        body: m.text,
        icon: '/icon.svg',
        tag: 'blah-' + m.id
      });
    } catch (err) {
      return; // the browser refused it; the unread counter still updates
    }
    // Clicking the popup jumps back to this tab with the cursor in the input
    n.onclick = function () {
      window.focus();
      closeNotifications();
      clearUnread();
      input.focus();
      log.scrollTop = log.scrollHeight;
    };
    openNotifications.push(n);
    if (openNotifications.length > 10) openNotifications.shift();
  }

  // Only for messages that are genuinely new - history replays pass notify=false
  function announce(m) {
    if (m.name === name) return; // our own message echoing back
    if (!document.hidden && document.hasFocus()) return; // they're reading the room
    unread++;
    document.title = '(' + unread + ') BLAH';
    if (notificationsOn()) showNotification(m);
  }

  window.addEventListener('focus', function () {
    closeNotifications();
    clearUnread();
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      closeNotifications();
      clearUnread();
    }
  });

  notifyBtn.addEventListener('click', function () {
    if (!notificationsSupported()) {
      addSys('this browser only shows notifications on a secure address - try ' + httpsHint());
      return;
    }
    if (Notification.permission === 'denied') {
      addSys('notifications are blocked for this site - allow them in your browser settings, then reload');
      return;
    }
    if (Notification.permission !== 'granted') {
      Notification.requestPermission().then(function (permission) {
        notifyWanted = permission === 'granted';
        localStorage.setItem('blah-notify', notifyWanted ? 'on' : 'off');
        renderNotifyButton();
        addSys(notifyWanted
          ? 'notifications on - you will get a popup when a message arrives while this window is in the background'
          : 'notifications were not allowed');
      });
      return;
    }
    notifyWanted = !notifyWanted;
    localStorage.setItem('blah-notify', notifyWanted ? 'on' : 'off');
    renderNotifyButton();
    addSys(notifyWanted ? 'notifications on' : 'notifications off');
  });

  renderNotifyButton();

  function setOnline(count) {
    onlineEl.textContent = count + ' online';
  }

  function startPolling() {
    setStatus('online', true);
    addSys('live updates limited, refreshing every 2s');
    var resyncing = true; // the first fetch loads the whole room, so nothing is new
    setInterval(function () {
      fetch('/messages?since=' + (resyncing ? 0 : lastId) + '&u=' + encodeURIComponent(name) + '&w=' + windowId)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (generation === null) {
            generation = data.generation;
          } else if (data.generation !== generation) {
            generation = data.generation;
            log.innerHTML = '';
            lastId = 0;
            addSys('chat history was cleared');
            // Message ids restart after a clear, so drop this stale batch and
            // reload the whole room on the next tick instead of crying wolf
            resyncing = true;
            return;
          }
          var replay = resyncing;
          resyncing = false;
          data.messages.forEach(function (m) { addMsg(m, !replay); });
          if (nearBottom) log.scrollTop = log.scrollHeight;
          setOnline(data.online);
          setStatus('online', true);
        })
        .catch(function () { setStatus('reconnecting…', false); });
    }, 2000);
  }

  var esOpened = false;
  var es = new EventSource('/events');

  es.onopen = function () {
    esOpened = true;
    setStatus('online', true);
  };
  es.onerror = function () {
    setStatus('reconnecting…', false);
  };
  es.onmessage = function (e) {
    var data = JSON.parse(e.data);
    if (data.type === 'history') {
      // Fresh stream: rebuild from scratch so reconnects self-heal. Messages
      // that showed up while we were disconnected count as new, but only if
      // this page already had a history loaded (so opening BLAH in a
      // background tab doesn't fire a popup for every old message) and only
      // if they are recent (so a long-dead tab doesn't wake up with a burst).
      var previousId = lastId;
      var missed = previousId > 0;
      var cutoff = Date.now() - 120000;
      log.innerHTML = '';
      lastId = 0;
      data.messages.forEach(function (m) {
        addMsg(m, missed && m.id > previousId && m.time > cutoff);
      });
      log.scrollTop = log.scrollHeight;
    } else if (data.type === 'message') {
      addMsg(data.message, true);
    } else if (data.type === 'cleared') {
      log.innerHTML = '';
      lastId = 0;
      if (data.generation) generation = data.generation;
      addSys(data.name + ' cleared the chat');
    } else if (data.type === 'online') {
      setOnline(data.count);
    }
  };

  // If the event stream can't get through, fall back to polling
  setTimeout(function () {
    if (!esOpened) {
      es.close();
      startPolling();
    }
  }, 4000);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || !name) return;
    input.value = '';
    if (text === '/clear') { clearChat(); return; }
    fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, text: text })
    }).then(function (r) {
      if (r.status === 429) addSys('slow down, message not sent');
      else if (!r.ok) addSys('message failed to send');
    }).catch(function () {
      addSys('message failed to send');
    });
    input.focus();
  });
})();
</script>
</body>
</html>
