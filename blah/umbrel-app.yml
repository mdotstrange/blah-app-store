manifestVersion: 1
id: blah
category: social
name: BLAH
version: "1.14.0"
tagline: A dead-simple local chat room
icon: https://raw.githubusercontent.com/MdotStrange/blah-app-store/master/blah/icon.svg
description: >-
  BLAH is a tiny early-internet-style chat room for your local network,
  dressed up like a Mac OS X Panther chat app: a brushed-metal window,
  iChat-style speech balloons, glossy Aqua buttons, a Stickies pad of notes
  and a shared to-do list. Prefer the 1990s? View > Windows 98 theme brings
  back the blue title bar and grey beveled buttons.


  No accounts, no passwords, no setup. Open it from any device that can
  reach your Umbrel, pick a name, and start typing. Anyone on your network
  with the app open sees the same room.


  The last 200 messages are stored on your Umbrel and survive app
  restarts. Anyone in the room can wipe the history for everyone with
  the clear button.
releaseNotes: >-
  The calendar has moved out of the side panel and into a page of its own.
  Click the calendar icon in the Dock (it shows today's date), the Calendar
  button on the Windows 98 taskbar, or View > Calendar, and the window turns
  into a full month you can actually read: every day shows the start of its
  note and how many to-do changes happened, and the panel on the right gives
  the chosen day a big note of up to 4000 characters plus that day's to-do
  history. Anything you type is kept when you click another day or go back
  to the chat. The BLAH icon, the Back to chat button or View > Calendar
  again take you back to the room. With the calendar gone, the notes and the
  to-do list get the whole side panel. All your day notes carry over.


  Bitcoin addresses typed in the chat or in a note are now spotted and
  checked: a valid one (1..., 3... or bc1..., including Taproot) gets a
  little orange coin and opens on mempool.space when clicked, and one that
  looks like an address but fails its checksum - usually a typo - gets a red
  wavy underline and a warning not to send to it.
