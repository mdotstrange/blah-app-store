manifestVersion: 1
id: blah
category: social
name: BLAH
version: "1.3.0"
tagline: A dead-simple local chat room
icon: https://raw.githubusercontent.com/MdotStrange/blah-app-store/master/blah/icon.svg
description: >-
  BLAH is a tiny early-internet-style chat room for your local network.


  No accounts, no passwords, no setup. Open it from any device that can
  reach your Umbrel, pick a name, and start typing. Anyone on your network
  with the app open sees the same room.


  The last 200 messages are stored on your Umbrel and survive app
  restarts. Anyone in the room can wipe the history for everyone with
  the clear button.
releaseNotes: >-
  Desktop notifications: click "notify" in the header and Chrome (or any
  browser) will pop up an OS notification with the sender and message whenever
  a message arrives while the BLAH window is in the background. Clicking the
  popup jumps back to the tab with the cursor in the input. Notifications need
  a secure address, so the app is opened over HTTPS (accept the Umbrel
  certificate or install Umbrel's local CA), and the tab title now shows an
  unread count as a fallback. Also serves the BLAH icon as the favicon.
