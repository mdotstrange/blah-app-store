id: blah
category: social
name: BLAH
version: "1.13.1"
tagline: A dead-simple local chat room
icon: https://raw.githubusercontent.com/MdotStrange/blah-app-store/master/blah/icon.svg
description: >-
  BLAH is a tiny early-internet-style chat room for your local network,
  dressed up like a Mac OS X Panther chat app: a brushed-metal window,
  iChat-style speech balloons, glossy Aqua buttons, a Stickies pad of notes
  and a shared to-do list. Prefer the 1990s? View > Windows 98 theme brings
  back the blue title bar and grey beveled buttons.


  No accounts, no passwords, no setup. Open it from any device that can
  reach your Umbrel, pick a name, and start typing. Anyone on your network
  with the app open sees the same room.


  The last 200 messages are stored on your Umbrel and survive app
  restarts. Anyone in the room can wipe the history for everyone with
  the clear button.
releaseNotes: >-
  BLAH now looks like a Mac OS X 10.3 Panther app. The window is brushed
  metal with red, yellow and green buttons, the menus sit in a menu bar
  across the top of the screen with the clock, and BLAH has its own icon in
  a Dock at the bottom. Messages appear as iChat-style speech balloons (yours
  on the right), buttons are glossy Aqua, the notes are a yellow Stickies pad,
  today glows in the calendar, and picking a name drops down as a sheet.
  The new Flavor menu dyes it all in an original iMac colour - Bondi Blue,
  Blueberry, Grape, Tangerine, Lime, Strawberry, Graphite, Ruby, Sage, Indigo,
  Snow, Blue Dalmatian or Flower Power - and everyone else's speech balloons
  come in their own iMac colours. The Windows 98 look is still there: choose View > Windows 98 theme, and
  View > Panther theme to switch back. Each browser remembers its theme and
  flavour. (1.13.1: updating now installs the new code too, so this is the
  update that actually brings the new look - your chat, notes, to-dos and
  files are kept.)
