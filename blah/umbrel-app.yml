manifestVersion: 1
id: blah
category: social
name: BLAH
version: "1.11.0"
tagline: A dead-simple local chat room
icon: https://raw.githubusercontent.com/MdotStrange/blah-app-store/master/blah/icon.svg
description: >-
  BLAH is a tiny early-internet-style chat room for your local network,
  dressed up like a 1990s instant messenger: blue title bar, grey beveled
  buttons, white message pane and a buddy list.


  No accounts, no passwords, no setup. Open it from any device that can
  reach your Umbrel, pick a name, and start typing. Anyone on your network
  with the app open sees the same room.


  The last 200 messages are stored on your Umbrel and survive app
  restarts. Anyone in the room can wipe the history for everyone with
  the clear button.
releaseNotes: >-
  Hardening release. The server no longer runs as root inside its container,
  shuts the door on other websites posting to or clearing your room behind your
  back, and shrugs off a couple of malformed requests that could previously
  restart it. Shared files now stream straight to disk instead of sitting in
  memory while they upload. No visible changes to the chat itself.
