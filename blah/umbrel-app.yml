manifestVersion: 1
id: blah
category: social
name: BLAH
version: "1.12.0"
tagline: A dead-simple local chat room
icon: https://raw.githubusercontent.com/MdotStrange/blah-app-store/master/blah/icon.svg
description: >-
  BLAH is a tiny early-internet-style chat room for your local network,
  dressed up like a 1990s instant messenger: blue title bar, grey beveled
  buttons, a white message pane, a pad of notes and a shared to-do list.


  No accounts, no passwords, no setup. Open it from any device that can
  reach your Umbrel, pick a name, and start typing. Anyone on your network
  with the app open sees the same room.


  The last 200 messages are stored on your Umbrel and survive app
  restarts. Anyone in the room can wipe the history for everyone with
  the clear button.
releaseNotes: >-
  The side panel no longer shows a list of everyone signed on. In its place is
  a Notes pane: type a short line, press Add and everyone in the room sees it -
  no titles, one line per note, editable and deletable by anyone, and it
  scrolls once it fills up. Like the to-do list and the calendar, the notes are
  shared and saved on your Umbrel. A divider between the notes and the to-do
  list lets you drag the two to whatever sizes you like, and web addresses
  typed in the chat or in a note now come out as links you can click.
  People > Who's here still tells you who is signed on.
